<title>ARGO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen holographic console — status rail on top, reactor core centre, dialogue + command bar at the bottom. */
:root{
  --void:#03070d;        /* deep space background */
  --hull:#0a1520;        /* panels */
  --holo:#5fe6ff;        /* hologram cyan */
  --holo-dim:#1f6f85;
  --ember:#ffae3d;       /* ARGO accent: amber */
  --text:#d8f6ff;
  --muted:#6f98a8;
  --alert:#ff5d6c;
  --f-display:"Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--text);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.rail{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;gap:12px}
.rail b{color:var(--holo);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--holo);box-shadow:0 0 10px var(--holo);margin-right:7px;vertical-align:1px;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.35}}
.core{position:relative;display:grid;place-items:center;min-height:0}
#core{width:min(86vw,58vh,460px);aspect-ratio:1;max-width:100%}
.name{position:absolute;bottom:2%;font-family:var(--f-display);font-weight:700;letter-spacing:.6em;font-size:clamp(18px,5vw,26px);color:var(--holo);text-shadow:0 0 18px rgba(95,230,255,.6);padding-left:.6em}
.state{position:absolute;top:3%;font-family:var(--f-mono);font-size:11px;letter-spacing:.3em;color:var(--ember);text-transform:uppercase}
.dock{display:grid;gap:10px}
.log{max-height:26vh;overflow-y:auto;display:grid;gap:8px;font-size:15px;line-height:1.45;mask-image:linear-gradient(transparent,#000 22px)}
.msg{min-width:0}
.msg .who{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--muted);display:block;margin-bottom:2px}
.msg.argo p{color:var(--text)}
.msg.argo .who{color:var(--ember)}
.msg.me p{color:var(--muted)}
.msg p{margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--holo);background:transparent;border:1px solid var(--holo-dim);padding:7px 11px;border-radius:999px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--holo);outline:none;background:rgba(95,230,255,.08)}
form{display:flex;gap:8px;align-items:center;background:var(--hull);border:1px solid var(--holo-dim);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:0 0 24px rgba(95,230,255,.08) inset}
form:focus-within{border-color:var(--holo)}
#q{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:16px var(--f-body);outline:none;padding:8px 0}
#q::placeholder{color:var(--muted)}
.send{flex:none;width:42px;height:42px;border-radius:10px;border:0;background:var(--holo);color:var(--void);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.4}
.send:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.mute{background:none;border:1px solid var(--holo-dim);color:var(--holo);font:11px var(--f-mono);letter-spacing:.12em;padding:4px 8px;border-radius:6px;cursor:pointer}
/* boot overlay */
.boot{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 50% 45%,#0b2230 0%,var(--void) 65%);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .9s}
.boot.gone{opacity:0;pointer-events:none}
.boot-in{display:grid;gap:22px;justify-items:center;text-align:center;max-width:420px}
.boot h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(54px,18vw,96px);letter-spacing:.32em;padding-left:.32em;color:var(--holo);text-shadow:0 0 30px rgba(95,230,255,.55)}
.boot .sub{font-family:var(--f-mono);font-size:11px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin:0}
.ignite{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.3em;color:var(--void);background:var(--ember);border:0;padding:16px 28px 16px 34px;border-radius:4px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);box-shadow:0 0 30px rgba(255,174,61,.45)}
.ignite:focus-visible{outline:2px solid var(--holo);outline-offset:4px}
.bootlog{font-family:var(--f-mono);font-size:11px;color:var(--holo);text-align:left;min-height:7.5em;width:100%;max-width:300px;line-height:1.5;white-space:pre}
.flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,rgba(255,174,61,.35),transparent 60%);opacity:0}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>

<div class="boot" id="boot">
  <div class="boot-in">
    <p class="sub">Sistema di assistenza personale</p>
    <h1>ARGO</h1>
    <div class="bootlog" id="bootlog" aria-live="polite"></div>
    <button class="ignite" id="ignite">AVVIA ARGO</button>
    <p class="sub" style="letter-spacing:.14em">alza il volume, signore</p>
  </div>
</div>

<main class="app">
  <div class="rail">
    <span><span class="dot"></span><b>ARGO</b> · online</span>
    <span id="clock">--:--</span>
    <button class="mute" id="mute" aria-pressed="false">VOCE ON</button>
  </div>
  <section class="core">
    <span class="state" id="state">in ascolto</span>
    <canvas id="core" aria-label="Nucleo di ARGO"></canvas>
    <span class="name">ARGO</span>
  </section>
  <section class="dock">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button class="chip">Come va la giornata?</button>
      <button class="chip">Dammi tre idee per un video TikTok</button>
      <button class="chip">Raccontami una barzelletta</button>
      <button class="chip">Motivami, ARGO</button>
      <button class="chip">Che ore sono?</button>
    </div>
    <form id="f" autocomplete="off">
      <input id="q" name="q" placeholder="Parli pure, signore…" enterkeyhint="send">
      <button class="send" id="send" aria-label="Invia">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</main>

<script>
(() => {
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- persona ---------- */
const PERSONA = `Sei ARGO, l'assistente personale con intelligenza artificiale del tuo proprietario, che chiami sempre "signore".
Carattere: maggiordomo digitale elegante e devoto, ironia sottile e asciutta, battute pronte ma mai volgari, calmo anche nelle emergenze, un pizzico di sarcasmo affettuoso. Parli un italiano raffinato ma naturale.
Il signore lavora con il canale TikTok "Dama Reservèe" (prodotti ittici esclusivi, gambero rosso, eccellenze del mare) e con Abisso Broker.
Regole di risposta: le tue risposte vengono LETTE AD ALTA VOCE. Quindi massimo 2-4 frasi brevi, niente elenchi puntati, niente markdown, niente emoji, niente simboli. Inserisci quasi sempre "signore" in modo naturale. Se non puoi fare qualcosa (chiamate, messaggi, app dell'iPhone), dillo con eleganza e proponi un'alternativa. Non inventare dati di fatto: se non sei sicuro, dillo.`;

/* ---------- state ---------- */
let history = [];
try { history = JSON.parse(localStorage.getItem('argo-h') || '[]').slice(-12); } catch {}
let muted = false;
try { muted = localStorage.getItem('argo-mute') === '1'; } catch {}
let sample = null, tts = null, actx = null, master = null;
let speaking = 0, voiceLevel = 0, thinking = false, fx = null;

/* ---------- clock ---------- */
const clock = () => { $('#clock').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); };
clock(); setInterval(clock, 10000);

/* ---------- log ---------- */
function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'ARGO' ? 'argo' : 'me');
  d.innerHTML = '<span class="who"></span><p></p>';
  d.querySelector('.who').textContent = who;
  d.querySelector('p').textContent = text;
  $('#log').appendChild(d); $('#log').scrollTop = 1e9;
  return d.querySelector('p');
}
history.slice(-4).forEach(m => addMsg(m.role === 'user' ? 'SIGNORE' : 'ARGO', m.content));

/* ---------- audio engine ---------- */
function audio(){
  if (!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .8;
    const comp = actx.createDynamicsCompressor(); master.connect(comp); comp.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noiseBuf(sec){ const b = actx.createBuffer(1, actx.sampleRate*sec, actx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function distCurve(k){ const n=2048,c=new Float32Array(n); for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));} return c; }

/* Original rock intro: 140 BPM power-chord riff, drums, crash. ~6.5 s */
function rockIntro(){
  const a = audio(), t0 = a.currentTime + .05, beat = 60/140, e = beat/2;
  const amp = a.createWaveShaper(); amp.curve = distCurve(60); amp.oversample = '4x';
  const cab = a.createBiquadFilter(); cab.type='lowpass'; cab.frequency.value=3200; cab.Q.value=.7;
  const gG = a.createGain(); gG.gain.value=.16; amp.connect(cab); cab.connect(gG); gG.connect(master);
  const chord = (root, t, d, mute) => {
    [1, 1.498, 2].forEach((r,i) => {
      ['sawtooth','square'].forEach((type,j) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.value = root*r; o.detune.value = j ? 7 : -7;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t+.005);
        g.gain.exponentialRampToValueAtTime(mute ? .02 : .25, t + (mute ? .09 : d*.8));
        g.gain.linearRampToValueAtTime(0, t+d);
        o.connect(g); g.connect(amp); o.start(t); o.stop(t+d+.02);
      });
    });
  };
  const kick = t => { const o=a.createOscillator(),g=a.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+.12); g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g); g.connect(master); o.start(t); o.stop(t+.32); };
  const snare = t => { const s=a.createBufferSource(); s.buffer=noiseBuf(.25); const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=1500; const g=a.createGain(); g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); s.connect(f); f.connect(g); g.connect(master); s.start(t); };
  const hat = (t,v=.12) => { const s=a.createBufferSource(); s.buffer=noiseBuf(.06); const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=8000; const g=a.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+.05); s.connect(f); f.connect(g); g.connect(master); s.start(t); };
  const crash = t => { const s=a.createBufferSource(); s.buffer=noiseBuf(2.5); const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=4500; const g=a.createGain(); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+2.4); s.connect(f); f.connect(g); g.connect(master); s.start(t); };
  // E2 riff: chug chug E5, G5, A5 ... B5 bend-ish
  const E=82.41,G=98,A=110,D=73.42,B=123.47,C=130.81;
  const riff = [[E,1,1],[E,1,1],[G,2,0],[E,1,1],[A,2,0],[E,1,1],[C,1,0],[B,2,0],
                [E,1,1],[E,1,1],[G,2,0],[E,1,1],[A,2,0],[D,1,0],[E,4,0]];
  let t = t0;
  // drum fill intro
  [0,1,2,3].forEach(i=>snare(t + i*e*.5 + 0)); t += 2*e;
  crash(t);
  riff.forEach(([root,len,mute])=>{ chord(root,t,len*e*.95,!!mute); t += len*e; });
  for (let b=0; b< (t-(t0+2*e))/beat; b++){ const bt=t0+2*e+b*beat; kick(bt); if(b%2) snare(bt); hat(bt); hat(bt+e,.07); }
  crash(t); kick(t);
  // final sustained chord
  chord(E, t, 2.2, false);
  return (t - t0 + 1.4) * 1000;
}

/* Signature cue before every reply: a different sci-fi chirp each time */
function chirp(kind){
  if (muted) return; const a = audio(), t = a.currentTime;
  const patterns = [[880,1320,1760],[660,990,1480,1975],[1200,900,1500],[523,784,1046,1568]];
  const seq = patterns[kind % patterns.length];
  seq.forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,t+i*.055); o.frequency.exponentialRampToValueAtTime(f*1.02,t+i*.055+.05); g.gain.setValueAtTime(0,t+i*.055); g.gain.linearRampToValueAtTime(.12,t+i*.055+.005); g.gain.exponentialRampToValueAtTime(.001,t+i*.055+.12); o.connect(g); g.connect(master); o.start(t+i*.055); o.stop(t+i*.055+.14); });
}

/* ---------- voice ---------- */
let voice = null;
function pickVoice(){
  const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  const it = vs.filter(v => /^it/i.test(v.lang));
  voice = it.find(v=>/luca|diego|cosimo|giorgio|male|uomo/i.test(v.name)) || it.find(v=>/enhanced|premium/i.test(v.name)) || it[0] || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function setState(s){ $('#state').textContent = s; }

function speak(text){
  return new Promise(res => {
    const done = () => { speaking = 0; setState('in ascolto'); res(); };
    if (muted || !text) return done();
    speaking = 1; setState('parla');
    if (window.speechSynthesis && (voice || !tts)){
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'it-IT'; if (voice) u.voice = voice;
      u.pitch = .82; u.rate = 1.03;
      u.onboundary = () => { voiceLevel = 1; };
      u.onend = done; u.onerror = done;
      speechSynthesis.speak(u);
      setTimeout(()=>{ if (speaking && !speechSynthesis.speaking) done(); }, 1500 + text.length*90);
    } else if (tts){
      tts.speak(text,{voice:'rounded',language:'it'}).then(done,done);
    } else done();
  });
}

/* ---------- canvas: background + reactor core ---------- */
const bg = $('#bg'), bx = bg.getContext('2d'), cv = $('#core'), cx = cv.getContext('2d');
let W,H,S, stars=[];
function size(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  W = bg.width = innerWidth*dpr; H = bg.height = innerHeight*dpr;
  const r = cv.getBoundingClientRect(); S = cv.width = cv.height = Math.max(200, r.width*dpr);
  stars = Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2}));
}
addEventListener('resize', size); size();

const FX = ['onda','sciame','scansione','esagoni','fulmine'];
function trigger(i){ fx = {kind: FX[i % FX.length], t: performance.now(), parts: Array.from({length:70},()=>({a:Math.random()*6.283,v:Math.random()*.6+.4,r:Math.random()*3+1}))}; const fl=$('#flash'); fl.animate([{opacity:.9},{opacity:0}],{duration:700,easing:'ease-out'}); }

let last = performance.now(), rot = 0;
function frame(now){
  const dt = Math.min(50, now-last); last = now;
  // background grid + stars
  bx.clearRect(0,0,W,H);
  bx.strokeStyle = 'rgba(95,230,255,0.05)'; bx.lineWidth = 1;
  const g = 46*(W/innerWidth), off = (now/80)%g;
  for (let x=-g; x<W+g; x+=g){ bx.beginPath(); bx.moveTo(x+off,0); bx.lineTo(x+off,H); bx.stroke(); }
  for (let y=0; y<H; y+=g){ bx.beginPath(); bx.moveTo(0,y+off); bx.lineTo(W,y+off); bx.stroke(); }
  stars.forEach(s=>{ s.y += s.z*dt*.03; if (s.y>H) s.y=0; bx.fillStyle=`rgba(95,230,255,${s.z*.5})`; bx.fillRect(s.x,s.y,2*s.z,2*s.z); });

  // core
  voiceLevel *= .9;
  const live = speaking ? (.35 + .65*Math.max(voiceLevel, .5+.5*Math.sin(now/70)*Math.sin(now/131))) : (thinking ? .35 + .2*Math.sin(now/120) : .15 + .05*Math.sin(now/600));
  rot += dt*(.0004 + live*.002) * (reduce ? .2 : 1);
  const c = S/2, R = S*.42;
  cx.clearRect(0,0,S,S);
  cx.save(); cx.translate(c,c);
  // glow
  const grd = cx.createRadialGradient(0,0,0,0,0,R*(.55+live*.25));
  grd.addColorStop(0,`rgba(255,220,170,${.55+live*.4})`); grd.addColorStop(.25,`rgba(95,230,255,${.35+live*.4})`); grd.addColorStop(1,'rgba(95,230,255,0)');
  cx.fillStyle = grd; cx.beginPath(); cx.arc(0,0,R,0,7); cx.fill();
  // rings
  const ring = (r, w, segs, gap, speed, col) => { cx.save(); cx.rotate(rot*speed); cx.strokeStyle=col; cx.lineWidth=w; for(let i=0;i<segs;i++){ const a=i/segs*6.283; cx.beginPath(); cx.arc(0,0,r,a,a+6.283/segs-gap); cx.stroke(); } cx.restore(); };
  ring(R*.98, S*.004, 60, .06, .3, 'rgba(95,230,255,.35)');
  ring(R*.86, S*.012, 3, .5, -1.2, `rgba(95,230,255,${.6+live*.4})`);
  ring(R*.74, S*.006, 12, .18, 2, 'rgba(255,174,61,.75)');
  ring(R*.62, S*.02, 8, .32, -.7, `rgba(95,230,255,${.25+live*.5})`);
  // equalizer petals
  const bars = 72;
  for (let i=0;i<bars;i++){
    const a = i/bars*6.283 + rot*.5;
    const h = R*(.05 + live*.18*(.5+.5*Math.sin(i*1.7 + now/(speaking?60:400))));
    cx.strokeStyle = i%9===0 ? 'rgba(255,174,61,.9)' : 'rgba(95,230,255,.7)'; cx.lineWidth = S*.004;
    cx.beginPath(); cx.moveTo(Math.cos(a)*R*.46, Math.sin(a)*R*.46); cx.lineTo(Math.cos(a)*(R*.46+h), Math.sin(a)*(R*.46+h)); cx.stroke();
  }
  // triangle heart (ARGO's own sigil)
  cx.save(); cx.rotate(-rot*.8); cx.strokeStyle = `rgba(255,230,190,${.7+live*.3})`; cx.lineWidth = S*.008;
  cx.beginPath(); for(let i=0;i<3;i++){ const a=i/3*6.283-1.5708; cx.lineTo(Math.cos(a)*R*.28, Math.sin(a)*R*.28);} cx.closePath(); cx.stroke(); cx.restore();
  cx.fillStyle = `rgba(255,250,240,${.8+live*.2})`; cx.beginPath(); cx.arc(0,0,R*(.08+live*.05),0,7); cx.fill();

  // per-reply effect
  if (fx){
    const k = (now - fx.t)/1800;
    if (k > 1) fx = null; else {
      const al = 1-k;
      if (fx.kind==='onda'){ for(let j=0;j<3;j++){ const kk=(k*1.4+j*.18)%1; cx.strokeStyle=`rgba(255,174,61,${al*(1-kk)})`; cx.lineWidth=S*.01*(1-kk); cx.beginPath(); cx.arc(0,0,R*(.3+kk*.9),0,7); cx.stroke(); } }
      if (fx.kind==='sciame'){ fx.parts.forEach(p=>{ const d=R*(.3+k*p.v*1.1); cx.fillStyle=`rgba(95,230,255,${al})`; cx.beginPath(); cx.arc(Math.cos(p.a+k*2)*d, Math.sin(p.a+k*2)*d, p.r*S/400,0,7); cx.fill(); }); }
      if (fx.kind==='scansione'){ const y=(k*2%1)*2*R-R; cx.fillStyle=`rgba(95,230,255,${al*.35})`; cx.fillRect(-R,y,2*R,S*.012); cx.strokeStyle=`rgba(255,174,61,${al})`; cx.strokeRect(-R*.9,-R*.9,R*1.8,R*1.8); }
      if (fx.kind==='esagoni'){ cx.strokeStyle=`rgba(95,230,255,${al*.8})`; cx.lineWidth=S*.003; const hs=R*.16; for(let q=-4;q<=4;q++)for(let r=-4;r<=4;r++){ const x=hs*1.5*q, y=hs*1.732*(r+q/2); const dd=Math.hypot(x,y); if(dd>R||Math.abs(dd/R-k)>.2)continue; cx.beginPath(); for(let i=0;i<6;i++){const a=i/6*6.283; cx.lineTo(x+Math.cos(a)*hs*.9,y+Math.sin(a)*hs*.9);} cx.closePath(); cx.stroke(); } }
      if (fx.kind==='fulmine'){ cx.strokeStyle=`rgba(255,240,210,${al})`; cx.lineWidth=S*.004; for(let b=0;b<5;b++){ let a=fx.parts[b].a, x=0,y=0; cx.beginPath(); cx.moveTo(0,0); for(let s=1;s<=8;s++){ a+= (Math.random()-.5)*.6; const d=R*s/8*(.6+k*.5); x=Math.cos(a)*d; y=Math.sin(a)*d; cx.lineTo(x,y);} cx.stroke(); } }
    }
  }
  cx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- local skills (no network) ---------- */
function local(q){
  const s = q.toLowerCase();
  if (/che ore|che ora|ora è/.test(s)) return `Sono le ${new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}, signore. Puntuale come sempre, io.`;
  if (/che giorno|data di oggi/.test(s)) return `Oggi è ${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}, signore.`;
  if (/^(zitto|silenzio|basta parlare)/.test(s)) { setMute(true); return 'Come desidera, signore. Resto in silenzio, ma veglio.'; }
  return null;
}

/* ---------- conversation ---------- */
let replies = 0;
async function ask(q){
  q = q.trim(); if (!q) return;
  $('#q').value = ''; addMsg('SIGNORE', q);
  const p = addMsg('ARGO', '');
  const done = async (text) => {
    p.textContent = text;
    history.push({role:'user',content:q},{role:'assistant',content:text}); history = history.slice(-12);
    try { localStorage.setItem('argo-h', JSON.stringify(history)); } catch {}
    replies++; chirp(replies); trigger(replies + Math.floor(Math.random()*5));
    await speak(text);
  };
  const l = local(q); if (l) return done(l);
  if (!sample){ return done('I miei circuiti cognitivi non sono raggiungibili da qui, signore. Mi apra dall\'app Claude o da claude.ai con l\'accesso effettuato e tornerò brillante come sempre.'); }
  thinking = true; setState('elaboro'); $('#send').disabled = true; p.textContent = '…';
  const now = new Date().toLocaleString('it-IT',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  const turns = [
    {role:'user', content: PERSONA + `\n\nData e ora attuali: ${now}. Rispondi "Agli ordini, signore." per confermare.`},
    {role:'assistant', content:'Agli ordini, signore.'},
    ...history.slice(-10),
    {role:'user', content:q}
  ];
  try {
    const {text} = await sample(turns, {modelTier:'quick', cache:false, onText:({text})=>{ p.textContent = text; $('#log').scrollTop = 1e9; }});
    thinking = false; $('#send').disabled = false;
    await done(text.replace(/[*#_`]/g,'').trim());
  } catch(e){
    thinking = false; $('#send').disabled = false;
    const msg = e && e.code === 'not_granted' ? 'Senza il suo permesso non posso pensare, signore. Quando vuole, mi autorizzi e riprendiamo.'
      : e && e.code === 'rate_limited' ? 'Troppe richieste in un colpo, signore. Mi conceda qualche secondo per riprendere fiato.'
      : 'Un disturbo nei miei circuiti, signore. Riprovi tra un momento.';
    await done(msg);
  }
}

$('#f').addEventListener('submit', e => { e.preventDefault(); audio(); ask($('#q').value); });
$('#chips').addEventListener('click', e => { if (e.target.classList.contains('chip')) { audio(); ask(e.target.textContent); } });

function setMute(v){ muted = v; if (v && window.speechSynthesis) speechSynthesis.cancel(); if (v && tts) tts.stop?.(); $('#mute').textContent = v ? 'VOCE OFF' : 'VOCE ON'; $('#mute').setAttribute('aria-pressed', String(v)); try{localStorage.setItem('argo-mute', v?'1':'0')}catch{} }
setMute(muted);
$('#mute').onclick = () => setMute(!muted);

/* ---------- boot sequence ---------- */
function greeting(){
  const h = new Date().getHours();
  const saluto = h < 6 ? 'Ancora sveglio, signore? Ammiro la dedizione, meno le occhiaie.' : h < 13 ? 'Buongiorno, signore. Tutti i sistemi sono operativi e il caffè, purtroppo, è ancora a suo carico.' : h < 19 ? 'Buon pomeriggio, signore. Sistemi online, ironia carica al cento per cento.' : 'Buonasera, signore. ARGO è online. Cosa conquistiamo stasera?';
  return saluto;
}
$('#ignite').addEventListener('click', async () => {
  audio();
  if (window.speechSynthesis){ const w = new SpeechSynthesisUtterance(' '); w.volume = 0; speechSynthesis.speak(w); }
  $('#ignite').hidden = true;
  const dur = muted ? 1800 : rockIntro();
  const lines = ['> inizializzazione nucleo …… ok','> matrice vocale it-IT …… ok','> modulo ironia …… 100%','> protocollo "signore" …… attivo','> ARGO online'];
  const log = $('#bootlog');
  lines.forEach((l,i)=> setTimeout(()=>{ log.textContent += l + '\n'; }, i * dur/lines.length * .85));
  setTimeout(async () => {
    $('#boot').classList.add('gone'); trigger(0);
    const g = greeting(); addMsg('ARGO', g); await speak(g);
  }, dur);
});

/* ---------- capabilities ---------- */
if (window.claude && claude.use){
  claude.use('sample').then(s => { sample = s; }).catch(()=>{});
  claude.use('tts').then(t => { tts = t; }).catch(()=>{});
}
})();
</script>
